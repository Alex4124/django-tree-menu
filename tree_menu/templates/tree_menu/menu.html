{% load menu_tags %}

<ul class="menu">
    {% for item in menu_items %}
        <li class="menu-item {% if item == active_item %}active{% endif %}">
            <a href="{% get_url item %}">{{ item.name }}</a>
            
            {% if item.id in items_to_expand %}
                {% with children=all_items|children_of:item %}
                    {% if children %}
                        {% include "tree_menu/menu.html" with menu_items=children %}
                    {% endif %}
                {% endwith %}
            {% endif %}
        </li>
    {% endfor %}
</ul>
