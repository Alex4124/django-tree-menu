<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест древовидного меню</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .menu {
            list-style: none;
            padding-left: 0;
        }
        .menu ul {
            list-style: none;
            padding-left: 20px;
        }
        .menu-item {
            margin: 5px 0;
        }
        .menu-item a {
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
            display: inline-block;
        }
        .menu-item.active > a {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .content {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Тестирование древовидного меню</h1>
    
    {% load menu_tags %}
    {% draw_menu 'main_menu' %}
    
    <div class="content">
        <h2>{{ page_name|default:"Главная страница" }}</h2>
        <p>Текущий URL: {{ request.path }}</p>
    </div>
</body>
</html>
